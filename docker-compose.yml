services:
  api1: &api
    image: ghcr.io/sudanvannin/rinha-2026-python/api@sha256:dc12d2dc967c8b64587df4e80b5874fa90f78baadbbda33b0e89224ed8337560
    platform: linux/amd64
    hostname: api1
    restart: unless-stopped
    environment:
      PORT: "8080"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      RINHA_USEARCH_EXPANSION_SEARCH: "384"
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.47"
          memory: "165MB"

  api2:
    <<: *api
    hostname: api2

  nginx:
    image: nginx:1.27-alpine
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.06"
          memory: "20MB"

networks:
  backend:
    driver: bridge

services:
  api1: &api
    image: ghcr.io/sudanvannin/rinha-2026-python/api@sha256:9f4b8c51cd803edf23c2ae5b4ddc9f1359ff44934b25c906e38f1066c5e7b501
    platform: linux/amd64
    hostname: api1
    restart: unless-stopped
    environment:
      PORT: "8080"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "150MB"

  api2:
    <<: *api
    hostname: api2

  nginx:
    image: nginx:1.27-alpine
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "30MB"

networks:
  backend:
    driver: bridge

services:
  api1: &api
    image: ghcr.io/sudanvannin/rinha-2026-python/api@sha256:8958ab37e3a7998fdd21b5c11a6362d9e82a3c1eba03f4398536103f3c871f82
    platform: linux/amd64
    hostname: api1
    restart: unless-stopped
    environment:
      PORT: "8080"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "165MB"

  api2:
    <<: *api
    hostname: api2

  nginx:
    image: nginx:1.27-alpine
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "20MB"

networks:
  backend:
    driver: bridge
